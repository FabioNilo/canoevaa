services:
  postgres:
    image: postgres:16-alpine
    container_name: ilheus-canoe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ilheus_canoe
    ports:
      - "5432:5432"
    volumes:
      - ilheus_canoe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ilheus_canoe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ilheus_canoe_postgres_data:
